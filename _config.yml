---
# Conversion
excerpt_separator: "\n\n"
highlighter: rouge
incremental: false
lsi: true
markdown: kramdown

# Handling reading
safe: false
encoding: utf-8
markdown_ext: md
strict_front_matter: false

# The following items will not be processed, by default. Any item listed under
# the `exclude:` key here will be automatically added to the internal "default
# list".
#
# Excluded items can be processed by explicitly listing the directories or their
# entries' file path in the `include:` list.
exclude:
- Gemfile
- Gemfile.lock
- README.md
- eslint.config.ts
- package.json
- pnpm-lock.yaml
- spec
- tsconfig.json
- vendor
- vite.config.ts

include:
- _pages

# Files and directories managed outside of Jekyll that should not be cleaned
# from the output directory.
keep_files:
- .git
- assets
- css
- js
- manifest.json
- sw.js

# Outputting
paginate: 8
paginate_path: /page:num/
permalink: /:categories/:title

# Markdown preprocessor settings
# commonmark:
#   extensions:
#   - autolink
#   - strikethrough
#   - table
#   # - tagfilter # Disabled to support iframe and script tags
#   options:
#   - FOOTNOTES
#   - GITHUB_PRE_LANG
#   - SMART
#   - STRIKETHROUGH_DOUBLE_TILDE
#   - UNSAFE

kramdown:
  auto_ids: true
  entity_output: as_char
  toc_levels: [1, 2, 3, 4, 5, 6]
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  input: GFM
  hard_wrap: false
  footnote_nr: 1
  math_engine: katex
  math_engine_opts:
    preview: true
  show_warnings: false

# Liquid template settings
liquid:
  error_mode: strict
  strict_filters: true
  strict_variables: false

# Front matter defaults
defaults:
- scope:
    path: ""  # an empty string here means all files in the project
    type: posts
  values:
    layout: post
    author: tomasbasham
    type: BlogPosting

# Plugins
jekyll-archives:
  enabled:
  - categories
  - tags
  layout: archive

jekyll-vite:
  base_dir: _resources
  manifest_paths:
  - _site/manifest.json

# Site settings
cover: https://cdn.tomasbasham.dev/covers/remote.jpg
description: Tomas Basham's Technology Blog and Development Portfolio
title: Tomas Basham's Blog
url: https://tomasbasham.dev
locale: en_GB

social:
  name: Tomas Basham
  links:
  - https://bsky.app/profile/tomasbasham.dev
  - https://github.com/tomasbasham
  - https://www.linkedin.com/in/tomas-basham-06244646
